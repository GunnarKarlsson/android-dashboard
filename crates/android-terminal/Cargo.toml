[package]
name = "android-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
adb-client = { path = "../adb-client", version = "0.1.0" }
ai-insight = { path = "../ai-insight", version = "0.1.0" }
anyhow.workspace = true
crossbeam-channel.workspace = true
dirs.workspace = true
dotenvy.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
egui_tiles.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", default-features = false, features = [
    "std",
    "NSAppearance",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.2.2", default-features = false, features = [
    "std",
] }
raw-window-handle = "0.6"
