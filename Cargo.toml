[workspace]
members = ["crates/adb-client", "crates/ai-insight", "crates/android-terminal"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.98"
crossbeam-channel = "0.5.15"
eframe = "0.31.1"
egui = "0.31.1"
egui_extras = { version = "0.31.1", default-features = false, features = ["svg"] }
egui_tiles = "0.12.0"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
ureq = { version = "2.12.1", features = ["json"] }
dirs = "6"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
